AWSTemplateFormatVersion: "2010-09-09"
Description: Creates DynamoDB tables for MLR application and attaches a managed IAM policy to a group for read/write access.

Parameters:
  NamePrefix:
    Type: String
    Default: mlr
    Description: Variable part of the DynamoDB table names

  GroupName:
    Type: String
    Default: MLR-user-group
    Description: Name of existing IAM Group

Resources:

  # ------------------------
  # DynamoDB Table: mlr_user_document_history
  # ------------------------
  UserDocumentHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${NamePrefix}_user_document_history"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_doc_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_doc_id
          KeyType: HASH

  # ------------------------
  # IAM Managed Policy (READ + WRITE)
  # ------------------------
  DynamoDBReadWriteManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Groups:
        - !Ref GroupName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
            Resource:
              - !GetAtt UserDocumentHistoryTable.Arn
              - !Sub "${UserDocumentHistoryTable.Arn}/index/*"

Outputs:
  UserDocumentHistoryTableName:
    Description: User Document History table name
    Value: !Ref UserDocumentHistoryTable

  UserDocumentHistoryTableArn:
    Description: User Document History table ARN
    Value: !GetAtt UserDocumentHistoryTable.Arn

  IAMManagedPolicyName:
    Description: IAM Managed Policy with DynamoDB read/write access
    Value: !Ref DynamoDBReadWriteManagedPolicy
