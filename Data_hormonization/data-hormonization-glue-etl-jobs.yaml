Outputs:
  DataHarmonizationGlueRoleArn:
    Value: !GetAtt DataHarmonizationGlueRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GlueRoleArn'
  DataHarmonizationOrchestratorName:
    Value: !Ref DataHarmonizationEtlOrchestrator
  DataHarmonizationTargetDatabaseName:
    Condition: ShouldCreateDatabase
    Value: !Ref DataHarmonizationTargetDatabase
  PostDeployInstructions:
    Value: >-
      After stack creation: (1) Ensure source data is available at SourceS3Path
      in Parquet or CSV format. (2) Start ETL jobs via orchestrator or individually.
      Jobs read directly from S3 - no crawlers needed.
      CLI: aws glue start-job-run --job-name <OrchestratorName>
  DataHarmonizationEtlCareSiteJobName:
