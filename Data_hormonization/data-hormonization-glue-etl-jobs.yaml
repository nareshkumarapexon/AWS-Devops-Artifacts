AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Data Harmonization ETL Pipeline — Glue Jobs with Direct S3 Reads (Generated)
  No crawlers needed - jobs read directly from S3

Parameters:
  ArtifactsBucket:
    Type: String
    Default: data-harmonisation-bucket
  SourceBucket:
    Type: String
    Default: data-harmonisation-bucket
  ArtifactsPrefix:
    Type: String
    Default: artifacts/etl-codegen/runs/5247a6a8-d8ea-4d5b-998d-4b530b8ea5e0/
    Description: >-
      S3 key prefix where generated ETL code was uploaded
      (e.g. artifacts/etl-codegen/runs/5247a6a8-d8ea-4d5b-998d-4b530b8ea5e0/)
  SourceS3Path:
    Type: String
    Default: s3://data-harmonisation-bucket/synthea_sample_data_test/
    Description: >-
      Full S3 path where source tables are stored as subfolders.
      This should point to the output location from schema-normalizer agent.
      Jobs will read from <SourceS3Path>/<table_name>/
      (e.g. s3://data-harmonisation-bucket/artifacts/schema-normalizer/runs/<run_id>/normalized/)
  TargetBucket:
    Type: String
    Default: data-harmonisation-bucket
    Description: S3 bucket for target output
  TargetPrefix:
    Type: String
    Default: glue-runtime/
    Description: Key prefix under TargetBucket for target tables
  TargetDatabase:
    Type: String
    Default: ehr_normalized_db
    Description: Glue database name for target OMOP tables (for catalog registration)
  TargetS3Path:
    Type: String
    Default: s3://data-harmonisation-bucket/glue-runtime/
    Description: >-
      Full s3:// path for target writes (passed to Glue jobs via --target_s3_path)
  ProcessingMode:
    Type: String
    Default: batch
    AllowedValues: [batch, incremental]
  CreateDatabase:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Set to true to create target Glue database. Default is true for easy deployment.
      Set to false if database already exists.
  GlueVersion:
    Type: String
    Default: '4.0'
  WorkerType:
    Type: String
    Default: G.2X
    AllowedValues: [G.1X, G.2X, G.4X, G.8X]
  NumberOfWorkers:
    Type: Number
    Default: 10
  Timeout:
    Type: Number
    Default: 2880
  MaxRetries:
    Type: Number
    Default: 2

Conditions:
  ShouldCreateDatabase:
    !Equals [!Ref CreateDatabase, 'true']

Resources:

  DataHarmonizationGlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-glue-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: DataHarmonizationEtlDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3SourceRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${SourceBucket}'
                  - !Sub 'arn:aws:s3:::${SourceBucket}/*'
              - Sid: S3TargetReadWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${TargetBucket}'
                  - !Sub 'arn:aws:s3:::${TargetBucket}/*'
              - Sid: S3ArtifactsRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactsBucket}'
                  - !Sub 'arn:aws:s3:::${ArtifactsBucket}/${ArtifactsPrefix}*'
              - Sid: GlueCatalogFull
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                  - glue:CreatePartition
                  - glue:BatchCreatePartition
                  - glue:UpdatePartition
                Resource: '*'
              - Sid: GlueJobOrchestration
                Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:BatchStopJobRun
                Resource: '*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  DataHarmonizationTargetDatabase:
    Type: AWS::Glue::Database
    Condition: ShouldCreateDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref TargetDatabase
        Description: >-
          Data Harmonization — OMOP CDM v5.4 target database
          (auto-created by ETL CodeGen stack)

  DataHarmonizationEtlCareSiteJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${AWS::StackName}-etl-care-site'
      Role: !GetAtt DataHarmonizationGlueRole.Arn
      GlueVersion: !Ref GlueVersion
      WorkerType: !Ref WorkerType
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: !Ref Timeout
      MaxRetries: !Ref MaxRetries
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${ArtifactsBucket}/${ArtifactsPrefix}jobs/etl_care_site.py'
      DefaultArguments:
        '--job-language': 'python'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${ArtifactsBucket}/${ArtifactsPrefix}sparkHistory/'
        '--TempDir': !Sub 's3://${ArtifactsBucket}/${ArtifactsPrefix}tmp/'
        '--source_s3_path': !Ref SourceS3Path
        '--target_s3_path': !Ref TargetS3Path
        '--processing_mode': !Ref ProcessingMode
        '--extra-py-files': !Sub 's3://${ArtifactsBucket}/${ArtifactsPrefix}common.zip'
        '--conf': 'spark.sql.adaptive.enabled=true'

