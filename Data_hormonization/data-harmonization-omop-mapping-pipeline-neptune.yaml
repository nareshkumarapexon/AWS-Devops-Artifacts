AWSTemplateFormatVersion: '2010-09-09'
Description: Data Harmonization - Neptune Lambda Function

Parameters:
  UseCaseName:
    Type: String
    Default: data-harmonization

  NeptuneClusterEndpoint:
    Type: String
    Default: data-harmon-neptune-serverless-cluster.cluster-cozcyso4a0ko.us-east-1.neptune.amazonaws.com
    Description: Neptune Serverless Endpoint


Resources:

  ########################################
  # IAM Role
  ########################################

  NeptuneLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${UseCaseName}-omop-mapping-pipeline-neptune-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub '${UseCaseName}-omop-mapping-pipeline-neptune-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${UseCaseName}*'
                  - !Sub 'arn:aws:s3:::${UseCaseName}*/*'
              - Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:GetJob
                  - glue:ListJobs
                  - glue:BatchStopJobRun
                Resource: !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${UseCaseName}*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UseCaseName}*'
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${UseCaseName}*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${UseCaseName}*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${UseCaseName}*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${UseCaseName}*'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
              - Effect: Allow
                Action:
                  - neptune-db:connect
                  - neptune-db:ReadDataViaQuery
                  - neptune-db:WriteDataViaQuery
                  - neptune-db:DeleteDataViaQuery
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:data-harmon*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-3-5-haiku-20241022-v1:0'
                  - 'arn:aws:bedrock:us-east-1:*:foundation-model/anthropic.claude-3-5-haiku-20241022-v1:0'
                  - 'arn:aws:bedrock:us-east-2:*:foundation-model/anthropic.claude-3-5-haiku-20241022-v1:0'
                  - 'arn:aws:bedrock:us-west-2:*:foundation-model/anthropic.claude-3-5-haiku-20241022-v1:0'
              - Effect: Allow
                Action:
                  - neptune-graph:ReadDataViaQuery
                  - neptune-graph:WriteDataViaQuery
                Resource: !Sub 'arn:aws:neptune-graph:${AWS::Region}:${AWS::AccountId}:graph/g-er8lla37c6'
              - Sid: EC2NetworkPermissions
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: '*'

  ########################################
  # Lambda Function
  ########################################

  NeptuneLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${UseCaseName}-omop-mapping-pipeline-neptune'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt NeptuneLambdaRole.Arn
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          NEPTUNE_SPARQL_ENDPOINT: !Sub 'https://${NeptuneClusterEndpoint}:8182/sparql'
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': 'Hello World'
              }

Outputs:
  LambdaFunctionArn:
    Value: !GetAtt NeptuneLambdaFunction.Arn
  LambdaRoleArn:
    Value: !GetAtt NeptuneLambdaRole.Arn
